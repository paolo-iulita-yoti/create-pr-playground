<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Playground</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Todo Playground</h1>

    <form id="todo-form" class="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="What needs doing?"
        autocomplete="off"
      />
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="app-footer">
      <span id="items-left">0 items left</span>
      <button id="clear-completed">Clear completed</button>
    </footer>
  </main>

  <div id="confirm-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <p id="confirm-title">Delete this todo?</p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="modal-btn">Cancel</button>
        <button id="confirm-delete" class="modal-btn danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
